name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
  lint:
    runs-on: ubuntu-latest
    container: php:8.5-cli
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: docker://php:8.0-cli
  compat:
    strategy:
      matrix:
        php-versions:
          - "8.4"
          - 8.5
        os: [ubuntu-latest]
